---
# Date: 2025-06-01
# https://hub.docker.com/r/linuxserver/jellyfin
# https://jellyfin.org/docs/
services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=100
      - TZ=Etc/UTC
      - JELLYFIN_PublishedServerUrl=https://192.168.111.11
    volumes:
      - CHANGE_TO_COMPOSE_DATA_PATH/jellyfin/library:/config
      - /pool0/archive/media/video/TV:/data/tvshows
      - /pool0/archive/media/video/Film:/data/movies
      - /pool0/archive/media/video/.jfcache:/data/cache
    ports:
      - 8096:8096
      - 8920:8920 #optional
      - 7359:7359/udp #optional
    #  - 1900:1900/udp #optional
    restart: unless-stopped
