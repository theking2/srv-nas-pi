# This is a Docker Compose file for a Speedtest container.
# it uses the proxy network to allow for reverse proxying through Nginx Proxy Manager.
networks:
  proxy:
    external: true

services:
  speedtest:
    container_name: openspeedtest
    image: openspeedtest/latest
    ports: [ "3000:3000", "3001:3001" ]
    networks: [ proxy ]
    restart: unless-stopped
    logging:
      options:
        max-size: "10K"
        max-file: "1"
    deploy:
      resources:
        limits:
          memory: 32M
        reservations:
          memory: 8M
    