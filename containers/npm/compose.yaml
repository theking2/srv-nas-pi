# This is a Docker Compose file for running Nginx Proxy Manager.
networks:
  proxy:
    external: true

services:
  nginx-proxy:
    container_name: nginx-proxy
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    cpus: 0.5 # cap at half a core max
    networks:
      - proxy
    
    environment:
      - PUID=1000
      - PGID=1000
    ports:
      - '192.168.0.11:9080:80'     # WAN 80 forward → Let's Encrypt (unchanged)
      - '192.168.0.11:9443:443'    # WAN 443 forward (router fixed, unchanged)
      - '192.168.111.11:80:80'     # LAN http → https redirect
      - '192.168.111.11:443:443'   # LAN https
      - '192.168.111.11:81:81'     # admin, LAN only

    volumes:
      - /pool0/storage/compose/npm/data:/data
      - /pool0/storage/compose/npm/letsencrypt:/etc/letsencrypt
